<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-label="Fabric Task Flows Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1017"/>
      <stop offset="1" stop-color="#141b2b"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a97ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2fe0c0"/>
      <stop offset="1" stop-color="#eafff9"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eaf1ff"/>
      <stop offset="1" stop-color="#bcd0ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="380" fill="url(#bg)"/>

  <!-- faint pipeline motif on the right -->
  <g opacity="0.10" fill="none" stroke="#7c9bff" stroke-width="4" stroke-linecap="round">
    <path d="M840 300 C 930 300, 910 150, 1010 150 S 1120 70, 1210 70"/>
  </g>
  <g opacity="0.16" fill="#7c9bff">
    <circle cx="840" cy="300" r="7"/><circle cx="930" cy="230" r="7"/>
    <circle cx="1010" cy="150" r="7"/><circle cx="1110" cy="100" r="7"/><circle cx="1210" cy="70" r="9"/>
  </g>

  <!-- logo tile -->
  <svg x="84" y="118" width="148" height="148" viewBox="0 0 256 256">
    <rect x="10" y="10" width="236" height="236" rx="54" fill="url(#tile)"/>
    <path d="M62 182 C 108 182, 104 132, 128 118 C 152 104, 150 74, 192 74"
          fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" opacity="0.95"/>
    <circle cx="62" cy="182" r="15" fill="#ffffff"/>
    <circle cx="128" cy="118" r="11" fill="#ffffff" opacity="0.82"/>
    <g transform="translate(192 74) rotate(45)">
      <rect x="-19" y="-19" width="38" height="38" rx="9" fill="url(#node)" stroke="#ffffff" stroke-width="5"/>
    </g>
  </svg>

  <!-- wordmark -->
  <text x="270" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="url(#wordmark)">Fabric Task Flows Studio</text>
  <text x="272" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#8b98a9">From problem to production — chat your way through the whole Microsoft Fabric pipeline.</text>

  <!-- badges -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600">
    <g transform="translate(272 258)">
      <rect width="250" height="40" rx="20" fill="#16233b" stroke="#2b3d5c"/>
      <circle cx="26" cy="20" r="6" fill="#3fb950"/>
      <text x="42" y="27" fill="#cfe0ff">Claude Code · Copilot</text>
    </g>
    <g transform="translate(538 258)">
      <rect width="182" height="40" rx="20" fill="#16233b" stroke="#2b3d5c"/>
      <text x="20" y="27" fill="#cfe0ff">7-phase pipeline</text>
    </g>
    <g transform="translate(736 258)">
      <rect width="168" height="40" rx="20" fill="#16233b" stroke="#2b3d5c"/>
      <text x="20" y="27" fill="#cfe0ff">Local web app</text>
    </g>
  </g>
</svg>
