<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Fabric Task Flows Studio logo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a97ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2fe0c0"/>
      <stop offset="1" stop-color="#eafff9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="236" height="236" rx="54" fill="url(#tile)"/>
  <!-- pipeline flow: problem -> ... -> delivered solution -->
  <path d="M62 182 C 108 182, 104 132, 128 118 C 152 104, 150 74, 192 74"
        fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" opacity="0.95" filter="url(#soft)"/>
  <circle cx="62" cy="182" r="15" fill="#ffffff"/>
  <circle cx="128" cy="118" r="11" fill="#ffffff" opacity="0.82"/>
  <!-- terminal node: Fabric-style diamond (the delivered solution) -->
  <g transform="translate(192 74) rotate(45)" filter="url(#soft)">
    <rect x="-19" y="-19" width="38" height="38" rx="9" fill="url(#node)" stroke="#ffffff" stroke-width="5"/>
  </g>
</svg>
