name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest pytest-cov ruff

      - name: Run tests
        env:
          PYTHONPATH: _shared
        run: python -m pytest _shared/tests/ --tb=short -q

      - name: Lint with ruff
        # Blocking — lint errors must be fixed, not warned about.
        run: ruff check _shared/

      - name: Run documentation drift check
        # Blocking — drift must be fixed or explicitly allow-listed.
        env:
          PYTHONPATH: _shared
        run: python .github/skills/fabric-test/scripts/check-drift.py --check
